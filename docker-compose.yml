services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank_reconcile_app
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=BankReconcile
      - APP_ENV=production
      - DEBUG=false
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - MAX_UPLOAD_SIZE_MB=25
      - LOG_LEVEL=INFO
      - METRICS_ENABLED=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
